<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Racer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
  }
  h1 { margin-bottom: 10px; letter-spacing: 2px; }
  #gameWrap { position: relative; }
  canvas {
    border: 4px solid #eee;
    border-radius: 8px;
    display: block;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 1px 1px 3px #000;
    line-height: 1.4;
  }
  #timerDisplay {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px 3px #000;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.82);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: 4px;
    padding: 20px;
  }
  #overlay h2 { font-size: 30px; margin-bottom: 10px; }
  #overlay p { margin-bottom: 14px; font-size: 15px; color: #ccc; }
  button {
    padding: 10px 24px;
    font-size: 16px;
    background: #e94560;
    border: none;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    margin: 6px;
    min-width: 200px;
  }
  button:hover { background: #ff5773; }
  button.secondary {
    background: #444;
  }
  button.secondary:hover { background: #666; }
  input[type="text"] {
    padding: 10px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    outline: none;
    text-align: center;
    width: 220px;
    margin-bottom: 14px;
  }
  #instructions {
    margin-top: 10px;
    color: #aaa;
    font-size: 14px;
  }
  .modeBtns { display: flex; flex-direction: column; }
  .nameTag {
    font-size: 13px;
    color: #ffd166;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<h1>🏎️ CAR RACER</h1>
<div id="gameWrap">
  <canvas id="game" width="400" height="600"></canvas>
  <div id="hud"></div>
  <div id="timerDisplay"></div>
  <div id="overlay"></div>
</div>
<div id="instructions">⬅️ ➡️ Move &nbsp; | &nbsp; ⬆️ ⬇️ Speed up / brake</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const timerDisplay = document.getElementById('timerDisplay');
const overlay = document.getElementById('overlay');

const W = canvas.width, H = canvas.height;
const roadLeft = 60, roadRight = W - 60, laneCount = 3;
const laneWidth = (roadRight - roadLeft) / laneCount;

let playerName = "Player";
let currentMode = null; // 1 = time attack, 2 = classic

// ---------- THEMES ----------
const THEMES = {
  1: { // Time Attack - dusk/sunset theme
    road: "#3a3450",
    grass: "#6a3fa0",
    edge: "#ffd166",
    dash: "#f4f1de",
    borderColor: "#ffd166",
    sky: ["#2b1055", "#7597de"]
  },
  2: { // Classic - daytime highway
    road: "#444444",
    grass: "#2d6a3f",
    edge: "#ffffff",
    dash: "#dddddd",
    borderColor: "#eeeeee",
    sky: ["#87ceeb", "#e0f7fa"]
  }
};

let keys = {};
document.addEventListener('keydown', e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
});
document.addEventListener('keyup', e => keys[e.key] = false);

function laneCenter(i) {
  return roadLeft + laneWidth * i + laneWidth / 2;
}

class Car {
  constructor(x, y, w, h, color) {
    this.x = x; this.y = y; this.w = w; this.h = h; this.color = color;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.fillStyle = this.color;
    roundRect(-this.w/2, -this.h/2, this.w, this.h, 6);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    roundRect(-this.w/2 + 5, -this.h/2 + 8, this.w - 10, this.h * 0.3, 3);
    ctx.fill();
    ctx.fillStyle = "#111";
    ctx.fillRect(-this.w/2 - 3, -this.h/2 + 5, 4, 12);
    ctx.fillRect(this.w/2 - 1, -this.h/2 + 5, 4, 12);
    ctx.fillRect(-this.w/2 - 3, this.h/2 - 17, 4, 12);
    ctx.fillRect(this.w/2 - 1, this.h/2 - 17, 4, 12);
    ctx.restore();
  }
  get bounds() {
    return {
      left: this.x - this.w/2 + 6,
      right: this.x + this.w/2 - 6,
      top: this.y - this.h/2 + 4,
      bottom: this.y + this.h/2 - 4
    };
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let player, enemies, score, baseSpeed, roadOffset, gameRunning, spawnTimer, spawnInterval;
let timeLeft, timerInterval;
const enemyColors = ["#3498db", "#f1c40f", "#2ecc71", "#9b59b6", "#e67e22"];

function resetGame() {
  player = new Car(laneCenter(1), H - 90, 36, 60, "#e94560");
  enemies = [];
  score = 0;
  baseSpeed = 3.5;
  roadOffset = 0;
  spawnTimer = 0;
  spawnInterval = 75;
  gameRunning = true;
  timeLeft = 120;
  updateHud();
}

function updateHud() {
  hud.innerHTML = `<div class="nameTag">${escapeHtml(playerName)}</div>Score: ${Math.floor(score)}`;
  if (currentMode === 1) {
    timerDisplay.textContent = "⏱ " + formatTime(timeLeft);
  } else {
    timerDisplay.textContent = "";
  }
}

function formatTime(t) {
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function spawnEnemy() {
  const lane = Math.floor(Math.random() * laneCount);
  const color = enemyColors[Math.floor(Math.random() * enemyColors.length)];
  enemies.push(new Car(laneCenter(lane), -80, 34, 58, color));
}

function collide(a, b) {
  const ab = a.bounds, bb = b.bounds;
  return ab.left < bb.right && ab.right > bb.left && ab.top < bb.bottom && ab.bottom > bb.top;
}

function update(dt) {
  if (!gameRunning) return;

  const speed = baseSpeed + score / 300;

  const moveSpeed = 5;
  if (keys["ArrowLeft"]) player.x -= moveSpeed;
  if (keys["ArrowRight"]) player.x += moveSpeed;
  let curSpeedMod = speed;
  if (keys["ArrowUp"]) curSpeedMod = speed * 1.6;
  if (keys["ArrowDown"]) curSpeedMod = speed * 0.5;

  const half = player.w / 2;
  if (player.x < roadLeft + half) player.x = roadLeft + half;
  if (player.x > roadRight - half) player.x = roadRight - half;

  roadOffset = (roadOffset + curSpeedMod) % 40;

  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnEnemy();
    spawnInterval = Math.max(35, 75 - score / 20);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    enemies[i].y += curSpeedMod;
    if (enemies[i].y > H + 80) {
      enemies.splice(i, 1);
    } else if (collide(player, enemies[i])) {
      if (currentMode === 2) {
        endGame(false);
        return;
      } else {
        // Time attack: crashing costs points but keeps racing
        score = Math.max(0, score - 25);
        enemies.splice(i, 1);
      }
    }
  }

  score += curSpeedMod * 0.05;
  updateHud();
}

function drawRoad() {
  const theme = THEMES[currentMode] || THEMES[2];

  // sky/background gradient outside road area shown via grass color for simplicity,
  // but add subtle gradient background behind everything
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, theme.sky[0]);
  grad.addColorStop(1, theme.sky[1]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = theme.grass;
  ctx.fillRect(0, 0, roadLeft, H);
  ctx.fillRect(roadRight, 0, W - roadRight, H);

  ctx.fillStyle = theme.road;
  ctx.fillRect(roadLeft, 0, roadRight - roadLeft, H);

  ctx.strokeStyle = theme.edge;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(roadLeft, 0); ctx.lineTo(roadLeft, H);
  ctx.moveTo(roadRight, 0); ctx.lineTo(roadRight, H);
  ctx.stroke();

  ctx.strokeStyle = theme.dash;
  ctx.lineWidth = 3;
  ctx.setLineDash([20, 20]);
  for (let i = 1; i < laneCount; i++) {
    const x = roadLeft + laneWidth * i;
    ctx.beginPath();
    ctx.moveTo(x, -40 + roadOffset);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawRoad();
  enemies.forEach(e => e.draw());
  player.draw();
}

let lastTime = null;
function loop(ts) {
  update();
  draw();
  if (gameRunning) requestAnimationFrame(loop);
}

function endGame(timeUp) {
  gameRunning = false;
  clearInterval(timerInterval);
  overlay.style.display = "flex";
  const title = timeUp ? "⏱ Time's Up!" : "💥 Crashed!";
  overlay.innerHTML = `
    <h2>${title}</h2>
    <p><strong>${escapeHtml(playerName)}</strong><br>Final Score: ${Math.floor(score)}</p>
    <div class="modeBtns">
      <button id="restartBtn">Race Again</button>
      <button id="menuBtn" class="secondary">Main Menu</button>
    </div>
  `;
  document.getElementById("restartBtn").addEventListener("click", () => startGame(currentMode));
  document.getElementById("menuBtn").addEventListener("click", showMainMenu);
}

function startGame(mode) {
  currentMode = mode;
  overlay.style.display = "none";
  resetGame();
  canvas.style.borderColor = THEMES[mode].borderColor;

  if (mode === 1) {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (!gameRunning) return;
      timeLeft -= 1;
      updateHud();
      if (timeLeft <= 0) {
        endGame(true);
      }
    }, 1000);
  }

  requestAnimationFrame(loop);
}

// ---------- MENUS ----------
function showMainMenu() {
  gameRunning = false;
  clearInterval(timerInterval);
  timerDisplay.textContent = "";
  hud.innerHTML = "";
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#333";
  ctx.fillRect(0, 0, W, H);
  canvas.style.borderColor = "#eee";

  overlay.style.display = "flex";
  overlay.innerHTML = `
    <h2>🏎️ Car Racer</h2>
    <p>Enter your name to begin</p>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="16" value="${escapeHtml(playerName === "Player" ? "" : playerName)}">
    <div class="modeBtns">
      <button id="newGameBtn">New Game</button>
    </div>
  `;
  document.getElementById("newGameBtn").addEventListener("click", () => {
    const val = document.getElementById("nameInput").value.trim();
    playerName = val.length > 0 ? val : "Player";
    showModeMenu();
  });
}

function showModeMenu() {
  overlay.innerHTML = `
    <h2>Welcome, ${escapeHtml(playerName)}!</h2>
    <p>Choose a game mode</p>
    <div class="modeBtns">
      <button id="mode1Btn">🌇 Mode 1: Time Attack (2 min)</button>
      <button id="mode2Btn">🛣️ Mode 2: Classic (Survival)</button>
      <button id="backBtn" class="secondary">Back</button>
    </div>
  `;
  document.getElementById("mode1Btn").addEventListener("click", () => startGame(1));
  document.getElementById("mode2Btn").addEventListener("click", () => startGame(2));
  document.getElementById("backBtn").addEventListener("click", showMainMenu);
}

// init
showMainMenu();
</script>

</body>
</html>
