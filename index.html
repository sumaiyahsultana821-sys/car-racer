<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Game Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #1a1a2e;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }
  h1 { font-size: clamp(26px, 6vw, 40px); letter-spacing: 1px; margin-bottom: 6px; text-align: center; }
  p.tagline { color: #9fb3d1; margin-bottom: 36px; text-align: center; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 760px;
  }
  a.card {
    display: block;
    background: #232847;
    border: 2px solid #33396b;
    border-radius: 14px;
    padding: 24px 20px;
    text-decoration: none;
    color: #fff;
    transition: transform .15s, border-color .15s, background .15s;
  }
  a.card:hover {
    transform: translateY(-4px);
    border-color: #e94560;
    background: #2b3160;
  }
  .icon { font-size: 40px; margin-bottom: 12px; display: block; }
  .card h2 { font-size: 19px; margin-bottom: 6px; }
  .card p { font-size: 13px; color: #b8c2e0; line-height: 1.4; }
</style>
</head>
<body>

<h1>🎮 Mini Game Arcade</h1>
<p class="tagline">Pick a game to play</p>

<div class="grid">
  <a class="card" href="./racer/">
    <span class="icon">🏎️</span>
    <h2>Car Racer</h2>
    <p>Dodge traffic, pick a mode and theme, and beat your best score. Touch &amp; keyboard controls.</p>
  </a>
  <a class="card" href="./pour-and-solve/">
    <span class="icon">💧</span>
    <h2>Pour &amp; Solve</h2>
    <p>Move, rotate, and draw planks to route water from a pipe into a glass using real physics.</p>
  </a>
</div>

</body>
</html>
