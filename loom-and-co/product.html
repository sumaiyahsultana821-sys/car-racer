<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Product | Loom &amp; Co.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="navbar">
    <a href="index.html" class="brand">Loom <span>&amp; Co.</span></a>
    <button class="nav-toggle js-nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span class="bar"></span></button>
    <div class="header-search">
      <form class="search-form js-search-form" role="search">
        <span aria-hidden="true">🔍</span>
        <input type="search" name="q" placeholder="Search dresses, tops, jeans..." aria-label="Search products">
        <button type="submit" class="sr-only">Search</button>
      </form>
    </div>
    <nav class="nav-menu js-nav-menu" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html">Categories</a>
      <a href="outfit-builder.html">Outfit Builder</a>
      <a href="wishlist.html">Wishlist <span class="nav-badge js-wish-count is-hidden">0</span></a>
      <a href="cart.html">Cart <span class="nav-badge js-cart-count is-hidden">0</span></a>
      <a href="profile.html">Profile</a>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <div id="not-found" class="empty-state" style="display:none;">
        <span class="big-icon">🙈</span>
        <p>We couldn't find that product.</p>
        <a href="shop.html" class="btn btn-outline">Back to Shop</a>
      </div>

      <div id="product-detail-root" style="display:none;">
        <div class="product-detail">
          <div id="detail-image"></div>
          <div>
            <h1 id="detail-name" style="font-size:1.5rem;"></h1>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
              <span class="price" id="detail-price" style="font-size:1.3rem;"></span>
              <span class="rating" id="detail-rating"></span>
            </div>
            <p id="detail-description" style="color:var(--ink-soft);"></p>

            <div>
              <label style="font-weight:600;font-size:0.85rem;">Size</label>
              <div id="size-row" class="size-row"></div>
            </div>

            <div>
              <label style="font-weight:600;font-size:0.85rem;">Quantity</label>
              <div class="qty-stepper" style="margin-top:8px;">
                <button type="button" id="qty-minus" aria-label="Decrease quantity">−</button>
                <input type="text" id="qty-input" value="1" inputmode="numeric" aria-label="Quantity">
                <button type="button" id="qty-plus" aria-label="Increase quantity">+</button>
              </div>
            </div>

            <div class="detail-actions">
              <button type="button" class="btn btn-primary" id="detail-add-cart">Add to Cart</button>
              <button type="button" class="icon-btn" id="detail-toggle-wish" aria-label="Add to wishlist">♡</button>
            </div>
          </div>
        </div>

        <section class="section" style="padding-left:0;padding-right:0;">
          <div class="section-head">
            <h2>You may also like</h2>
          </div>
          <div id="related-grid" class="grid-scroll"></div>
        </section>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>Loom &amp; Co. — thoughtfully made everyday fashion.</p>
    <p>&copy; 2026 Loom &amp; Co. All rights reserved.</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const product = getProductById(params.get('id'));

    if (!product) {
      document.getElementById('not-found').style.display = 'block';
      return;
    }

    document.getElementById('product-detail-root').style.display = 'block';
    document.title = `${product.name} | Loom & Co.`;

    document.getElementById('detail-image').innerHTML = productImageHtml(product);
    document.getElementById('detail-name').textContent = product.name;
    document.getElementById('detail-price').textContent = money(product.price);
    document.getElementById('detail-rating').innerHTML = `${starString(product.rating)} <span class="rating-num">${product.rating} rating</span>`;
    document.getElementById('detail-description').textContent = product.description;

    let selectedSize = product.sizes[0];
    const sizeRow = document.getElementById('size-row');
    sizeRow.innerHTML = product.sizes.map(s =>
      `<button type="button" class="size-btn ${s === selectedSize ? 'is-selected' : ''}" data-size="${s}">${s}</button>`
    ).join('');
    sizeRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.size-btn');
      if (!btn) return;
      selectedSize = btn.dataset.size;
      sizeRow.querySelectorAll('.size-btn').forEach(b => b.classList.toggle('is-selected', b === btn));
    });

    const qtyInput = document.getElementById('qty-input');
    function clampQty() {
      let n = parseInt(qtyInput.value, 10);
      if (!Number.isFinite(n) || n < 1) n = 1;
      if (n > 20) n = 20;
      qtyInput.value = n;
      return n;
    }
    document.getElementById('qty-minus').addEventListener('click', () => {
      qtyInput.value = Math.max(1, clampQty() - 1);
    });
    document.getElementById('qty-plus').addEventListener('click', () => {
      qtyInput.value = Math.min(20, clampQty() + 1);
    });
    qtyInput.addEventListener('change', clampQty);

    document.getElementById('detail-add-cart').addEventListener('click', () => {
      const qty = clampQty();
      addToCart(product.id, selectedSize, qty);
      toast(`Added ${qty} × "${product.name}" (${selectedSize}) to cart`);
    });

    const wishBtn = document.getElementById('detail-toggle-wish');
    function syncWishBtn() {
      const wished = isWishlisted(product.id);
      wishBtn.textContent = wished ? '♥' : '♡';
      wishBtn.classList.toggle('is-active', wished);
      wishBtn.setAttribute('aria-pressed', String(wished));
      wishBtn.setAttribute('aria-label', wished ? 'Remove from wishlist' : 'Add to wishlist');
    }
    syncWishBtn();
    wishBtn.addEventListener('click', () => {
      const wished = toggleWishlist(product.id);
      syncWishBtn();
      toast(wished ? `Saved "${product.name}" to wishlist` : `Removed "${product.name}" from wishlist`);
    });

    const related = PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0, 8);
    document.getElementById('related-grid').innerHTML = related.map(productCardHtml).join('') ||
      '<p class="empty-state">No related products yet.</p>';
  });
</script>
</body>
</html>
