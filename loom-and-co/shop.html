<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Loom &amp; Co.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="navbar">
    <a href="index.html" class="brand">Loom <span>&amp; Co.</span></a>
    <button class="nav-toggle js-nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span class="bar"></span></button>
    <div class="header-search">
      <form class="search-form js-search-form" role="search">
        <span aria-hidden="true">🔍</span>
        <input type="search" id="shop-search" name="q" placeholder="Search dresses, tops, jeans..." aria-label="Search products">
        <button type="submit" class="sr-only">Search</button>
      </form>
    </div>
    <nav class="nav-menu js-nav-menu" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="categories.html">Categories</a>
      <a href="outfit-builder.html">Outfit Builder</a>
      <a href="wishlist.html">Wishlist <span class="nav-badge js-wish-count is-hidden">0</span></a>
      <a href="cart.html">Cart <span class="nav-badge js-cart-count is-hidden">0</span></a>
      <a href="profile.html">Profile</a>
    </nav>
  </div>
</header>

<main>
  <section class="section" style="padding-bottom:0;">
    <div class="container">
      <h1 style="font-size:1.6rem;">Shop All</h1>

      <div class="shop-toolbar">
        <div class="chip-row" id="category-chips"></div>
      </div>
      <div class="shop-toolbar">
        <span id="result-count" style="color:var(--ink-soft);font-size:0.88rem;"></span>
        <select class="select-sort" id="sort-select" aria-label="Sort products">
          <option value="featured">Featured</option>
          <option value="new">Newest</option>
          <option value="trending">Trending</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:16px;">
    <div class="container">
      <div id="product-grid" class="grid"></div>
      <div id="empty-state" class="empty-state" style="display:none;">
        <span class="big-icon">🔎</span>
        <p>No products match your search.</p>
        <button type="button" class="btn btn-outline" id="clear-filters">Clear filters</button>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>Loom &amp; Co. — thoughtfully made everyday fashion.</p>
    <p>&copy; 2026 Loom &amp; Co. All rights reserved.</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const state = { category: '', q: '', sort: 'featured' };

  function readStateFromUrl() {
    const params = new URLSearchParams(window.location.search);
    state.category = params.get('category') || '';
    state.q = params.get('q') || '';
    const sortParam = params.get('sort');
    if (sortParam === 'new') state.sort = 'new';
    else if (sortParam === 'trending') state.sort = 'trending';
    else if (sortParam) state.sort = sortParam;
  }

  function renderChips() {
    const chipsEl = document.getElementById('category-chips');
    const chips = [{ id: '', name: 'All' }, ...CATEGORIES];
    chipsEl.innerHTML = chips.map(c =>
      `<button type="button" class="chip ${state.category === c.id ? 'is-active' : ''}" data-cat="${c.id}">${c.name}</button>`
    ).join('');
    chipsEl.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        state.category = btn.dataset.cat;
        renderChips();
        render();
      });
    });
  }

  function getFiltered() {
    let list = PRODUCTS.slice();
    if (state.category) list = list.filter(p => p.category === state.category);
    if (state.q) {
      const q = state.q.toLowerCase();
      list = list.filter(p => p.name.toLowerCase().includes(q) || p.category.includes(q));
    }
    switch (state.sort) {
      case 'new': list = list.filter(p => p.tag === 'New').concat(list.filter(p => p.tag !== 'New')); break;
      case 'trending': list = list.filter(p => p.tag === 'Trending').concat(list.filter(p => p.tag !== 'Trending')); break;
      case 'price-asc': list.sort((a, b) => a.price - b.price); break;
      case 'price-desc': list.sort((a, b) => b.price - a.price); break;
      case 'rating': list.sort((a, b) => b.rating - a.rating); break;
      default: break;
    }
    return list;
  }

  function render() {
    const list = getFiltered();
    const grid = document.getElementById('product-grid');
    const empty = document.getElementById('empty-state');
    const count = document.getElementById('result-count');
    count.textContent = `${list.length} product${list.length === 1 ? '' : 's'}`;
    if (list.length === 0) {
      grid.innerHTML = '';
      grid.style.display = 'none';
      empty.style.display = 'block';
    } else {
      grid.style.display = 'grid';
      empty.style.display = 'none';
      grid.innerHTML = list.map(productCardHtml).join('');
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    readStateFromUrl();
    document.getElementById('shop-search').value = state.q;
    document.getElementById('sort-select').value = ['featured','new','trending','price-asc','price-desc','rating'].includes(state.sort) ? state.sort : 'featured';
    renderChips();
    render();

    document.getElementById('sort-select').addEventListener('change', (e) => {
      state.sort = e.target.value;
      render();
    });

    const searchInput = document.getElementById('shop-search');
    searchInput.addEventListener('input', () => {
      state.q = searchInput.value.trim();
      render();
    });
    document.querySelector('.js-search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      state.q = searchInput.value.trim();
      render();
    });

    document.getElementById('clear-filters').addEventListener('click', () => {
      state.category = '';
      state.q = '';
      state.sort = 'featured';
      searchInput.value = '';
      document.getElementById('sort-select').value = 'featured';
      renderChips();
      render();
    });
  });
</script>
</body>
</html>
