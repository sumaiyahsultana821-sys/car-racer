<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories | Loom &amp; Co.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="navbar">
    <a href="index.html" class="brand">Loom <span>&amp; Co.</span></a>
    <button class="nav-toggle js-nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span class="bar"></span></button>
    <div class="header-search">
      <form class="search-form js-search-form" role="search">
        <span aria-hidden="true">🔍</span>
        <input type="search" name="q" placeholder="Search dresses, tops, jeans..." aria-label="Search products">
        <button type="submit" class="sr-only">Search</button>
      </form>
    </div>
    <nav class="nav-menu js-nav-menu" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html" class="active">Categories</a>
      <a href="outfit-builder.html">Outfit Builder</a>
      <a href="wishlist.html">Wishlist <span class="nav-badge js-wish-count is-hidden">0</span></a>
      <a href="cart.html">Cart <span class="nav-badge js-cart-count is-hidden">0</span></a>
      <a href="profile.html">Profile</a>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <h1 style="font-size:1.6rem;">Shop by Category</h1>
      <p style="color:var(--ink-soft);max-width:52ch;">Dresses, tops, jeans, kurti sets, jackets, shoes and accessories — find exactly what you're looking for.</p>
      <div id="category-grid" class="grid"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>Loom &amp; Co. — thoughtfully made everyday fashion.</p>
    <p>&copy; 2026 Loom &amp; Co. All rights reserved.</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('category-grid');
    grid.innerHTML = CATEGORIES.map(c => {
      const count = PRODUCTS.filter(p => p.category === c.id).length;
      return `
      <a class="category-card" href="shop.html?category=${c.id}">
        <span class="cat-icon">${c.icon}</span>
        <h3>${c.name}</h3>
        <p>${c.blurb}</p>
        <p>${count} items</p>
      </a>`;
    }).join('');
  });
</script>
</body>
</html>
