<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist | Loom &amp; Co.</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="navbar">
    <a href="index.html" class="brand">Loom <span>&amp; Co.</span></a>
    <button class="nav-toggle js-nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span class="bar"></span></button>
    <div class="header-search">
      <form class="search-form js-search-form" role="search">
        <span aria-hidden="true">🔍</span>
        <input type="search" name="q" placeholder="Search dresses, tops, jeans..." aria-label="Search products">
        <button type="submit" class="sr-only">Search</button>
      </form>
    </div>
    <nav class="nav-menu js-nav-menu" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="categories.html">Categories</a>
      <a href="outfit-builder.html">Outfit Builder</a>
      <a href="wishlist.html" class="active">Wishlist <span class="nav-badge js-wish-count is-hidden">0</span></a>
      <a href="cart.html">Cart <span class="nav-badge js-cart-count is-hidden">0</span></a>
      <a href="profile.html">Profile</a>
    </nav>
  </div>
</header>

<main>
  <section class="section">
    <div class="container">
      <h1 style="font-size:1.6rem;">Your Wishlist</h1>

      <div id="wishlist-list"></div>

      <div id="wishlist-empty" class="empty-state" style="display:none;">
        <span class="big-icon">♡</span>
        <p>You haven't saved any favourites yet.</p>
        <a href="shop.html" class="btn btn-outline">Browse the Shop</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>Loom &amp; Co. — thoughtfully made everyday fashion.</p>
    <p>&copy; 2026 Loom &amp; Co. All rights reserved.</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  function renderWishlist() {
    const ids = getWishlist();
    const products = ids.map(getProductById).filter(Boolean);
    const listEl = document.getElementById('wishlist-list');
    const emptyEl = document.getElementById('wishlist-empty');

    if (products.length === 0) {
      listEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    listEl.innerHTML = products.map(p => `
      <div class="wish-card" data-id="${p.id}">
        ${productImageHtml(p)}
        <div class="wish-card-body">
          <div style="font-weight:600;">${escapeHtml(p.name)}</div>
          <div class="product-card-meta" style="max-width:220px;">
            <span class="price">${money(p.price)}</span>
            <span class="rating">${starString(p.rating)} <span class="rating-num">${p.rating}</span></span>
          </div>
          <select class="js-size-select" data-id="${p.id}" aria-label="Select size for ${escapeHtml(p.name)}" style="margin-top:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;">
            ${p.sizes.map(s => `<option value="${s}">${s}</option>`).join('')}
          </select>
        </div>
        <div class="wish-card-actions">
          <button type="button" class="btn btn-sm btn-primary js-move-cart" data-id="${p.id}">Move to Cart</button>
          <button type="button" class="btn btn-sm btn-danger js-remove-wish" data-id="${p.id}">Remove</button>
        </div>
      </div>
    `).join('');
  }

  document.addEventListener('DOMContentLoaded', () => {
    renderWishlist();

    document.getElementById('wishlist-list').addEventListener('click', (e) => {
      const moveBtn = e.target.closest('.js-move-cart');
      if (moveBtn) {
        const id = Number(moveBtn.dataset.id);
        const product = getProductById(id);
        const sizeSelect = document.querySelector(`.js-size-select[data-id="${id}"]`);
        const size = sizeSelect ? sizeSelect.value : product.sizes[0];
        addToCart(id, size, 1);
        removeFromWishlist(id);
        toast(`Moved "${product.name}" to cart`);
        renderWishlist();
        return;
      }
      const removeBtn = e.target.closest('.js-remove-wish');
      if (removeBtn) {
        const id = Number(removeBtn.dataset.id);
        const product = getProductById(id);
        removeFromWishlist(id);
        toast(`Removed "${product ? product.name : 'item'}" from wishlist`);
        renderWishlist();
      }
    });
  });
</script>
</body>
</html>
